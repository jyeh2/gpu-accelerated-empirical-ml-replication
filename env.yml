name: ml_gpu_env
channels:
  - rapidsai
  - conda-forge
  - nvidia

dependencies:
  - python=3.10
  
  # RAPIDS suite (includes cuml, cupy, and other dependencies)
  # This automatically handles cupy/cuml compatibility
  - rapids=25.10
  - cuda-version=12.0
  
  # Additional ML libraries
  - scikit-learn
  - xgboost
  
  # Data handling (may already be included by rapids)
  - numpy
  - pandas
  - scipy
  
  # Visualization
  - matplotlib
  - seaborn
  
  # Jupyter (optional but recommended)
  - jupyter
  - ipykernel